<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ 创意模式 Creative Mode</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a12;
    color: #e8e8f0;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    height: 100vh;
  }

  #galaxy {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  .overlay {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 40px;
    pointer-events: none;
  }

  header h1 {
    font-size: clamp(28px, 5vw, 56px);
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #ff6ec4, #7873f5, #4adede, #ff6ec4);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: flow 6s linear infinite;
  }

  @keyframes flow {
    to { background-position: 300% 0; }
  }

  header p {
    margin-top: 8px;
    color: #8888a0;
    letter-spacing: 2px;
  }

  .badge {
    display: inline-block;
    margin-top: 12px;
    padding: 4px 14px;
    border: 1px solid #ff6ec4;
    border-radius: 999px;
    font-size: 12px;
    color: #ff6ec4;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    50% { box-shadow: 0 0 18px #ff6ec466; }
  }

  .bottom {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 520px;
  }

  #poem {
    min-height: 84px;
    padding: 20px 24px;
    border-left: 3px solid #4adede;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(8px);
    border-radius: 0 12px 12px 0;
    font-size: 17px;
    line-height: 1.9;
    transition: opacity .4s;
  }

  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  button {
    padding: 12px 24px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    color: #fff;
    letter-spacing: 1px;
    transition: transform .15s, box-shadow .15s;
  }

  button:hover { transform: translateY(-2px); }
  button:active { transform: translateY(0) scale(.97); }

  #btnPoem {
    background: linear-gradient(135deg, #7873f5, #4adede);
    box-shadow: 0 4px 20px #7873f566;
  }

  #btnMode {
    background: linear-gradient(135deg, #ff6ec4, #f5b473);
    box-shadow: 0 4px 20px #ff6ec466;
  }

  .hint {
    font-size: 12px;
    color: #66667a;
  }
</style>
</head>
<body>

<canvas id="galaxy"></canvas>

<div class="overlay">
  <header>
    <h1>CREATIVE MODE</h1>
    <p>创意模式已开启 · 移动鼠标，搅动星河</p>
    <span class="badge">● INSPIRATION ONLINE</span>
  </header>

  <div class="bottom">
    <div id="poem">灵感如流星划过——<br>点击下方按钮，打捞一句碎片诗。</div>
    <div class="controls">
      <button id="btnPoem">🎲 生成碎片诗</button>
      <button id="btnMode">🌀 切换粒子形态</button>
    </div>
    <p class="hint">提示：粒子会追随你的光标 · 按空格键也可生成诗句</p>
  </div>
</div>

<script>
/* ---------- 粒子星银河 ---------- */
const canvas = document.getElementById('galaxy');
const ctx = canvas.getContext('2d');
let W, H, particles = [];
const mouse = { x: -999, y: -999 };
let mode = 0; // 0=星云 1=螺旋 2=雨滴
const MODES = ['星云 NEbula', '螺旋 Vortex', '雨滴 Rain'];

function resize() {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
}
resize();
addEventListener('resize', resize);
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('mouseleave', () => { mouse.x = -999; mouse.y = -999; });

const COUNT = 260;
const PALETTE = ['#ff6ec4', '#7873f5', '#4adede', '#f5e663', '#8affc1'];

class Particle {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : (mode === 2 ? -10 : Math.random() * H);
    this.vx = (Math.random() - .5) * .6;
    this.vy = (Math.random() - .5) * .6;
    this.size = Math.random() * 2.2 + .5;
    this.color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    this.life = 1;
    this.angle = Math.random() * Math.PI * 2;
  }
  step() {
    // 鼠标引力
    const dx = mouse.x - this.x, dy = mouse.y - this.y;
    const d = Math.hypot(dx, dy);
    if (d < 180 && d > 1) {
      const f = (180 - d) / 180 * .35;
      this.vx += dx / d * f;
      this.vy += dy / d * f;
    }
    if (mode === 1) { // 螺旋
      this.angle += .02;
      this.vx += Math.cos(this.angle) * .06;
      this.vy += Math.sin(this.angle) * .06;
    }
    if (mode === 2) this.vy += .05; // 雨滴重力
    this.vx *= .96; this.vy *= .96;
    this.x += this.vx; this.y += this.vy;
    if (this.x < -20 || this.x > W + 20 || this.y < -20 || this.y > H + 20) this.reset(false);
  }
  draw() {
    ctx.globalAlpha = .8;
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}
for (let i = 0; i < COUNT; i++) particles.push(new Particle());

/* 鼠标光晕轨迹 */
const trail = [];
addEventListener('mousemove', e => {
  trail.push({ x: e.clientX, y: e.clientY, a: 1 });
  if (trail.length > 40) trail.shift();
});

function loop() {
  ctx.fillStyle = 'rgba(10,10,18,0.18)';
  ctx.fillRect(0, 0, W, H);
  for (const p of particles) { p.step(); p.draw(); }
  // 轨迹线
  ctx.shadowBlur = 0;
  for (let i = 1; i < trail.length; i++) {
    const t = trail[i];
    t.a *= .94;
    ctx.globalAlpha = t.a * .5;
    ctx.strokeStyle = '#4adede';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
    ctx.lineTo(t.x, t.y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(loop);
}
loop();

/* ---------- 碎片诗生成器（随机拼贴） ---------- */
const FRAGMENTS = [
  ['月亮', '拆解了', '大海的寂静'],
  ['风', '把城市', '折成纸飞机'],
  ['时间在', '茶杯里', '慢慢沉淀'],
  ['星光', '落进', '未发送的信'],
  ['梦境', '绕过', '现实的围墙'],
  ['一朵云', '偷走了', '山的影子'],
  ['记忆', '在旧相机里', '显影'],
  ['雨', '翻译了', '天空的密语'],
  ['孤独的鲸', '唱着', '频率 52Hz 的歌'],
  ['春天', '从裂缝里', '探出头来'],
];

const poemEl = document.getElementById('poem');
function makePoem() {
  const pool = [...FRAGMENTS];
  const lines = [];
  for (let i = 0; i < 2; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    lines.push(pool.splice(idx, 1)[0].join(''));
  }
  poemEl.style.opacity = 0;
  setTimeout(() => {
    poemEl.innerHTML = lines.join('<br>') + '<br>——《碎片集》';
    poemEl.style.opacity = 1;
  }, 250);
}
document.getElementById('btnPoem').addEventListener('click', makePoem);

document.getElementById('btnMode').addEventListener('click', e => {
  mode = (mode + 1) % 3;
  e.target.textContent = `🌀 粒子形态：${MODES[mode]}`;
  particles.forEach(p => p.reset(false));
});

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); makePoem(); }
});
</script>

</body>
</html>
